[project]
name = "strangeverse-backend"
version = "0.1.0"
description = "StrangeVerse - swarm intelligence simulation engine"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "StrangeVerse contributors" }
]

dependencies = [
    # Core
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.13.0",
    
    # OASIS social simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # Files
    "PyMuPDF>=1.24.0",
    # Encoding detection
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Utils
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
